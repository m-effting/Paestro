<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PAESTRO - Exportar Chamadas</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/navbar.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/header.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/exportar.css') }}">
    <link rel="icon" href="static/css/favicon12.png" type="image/png"> 
    <link rel="icon" type="image/png" sizes="128x128"  href="/css/favicon12.png"> 
    <meta name="msapplication-TileColor" content="#ffffff"> 
    <meta name="theme-color" content="#ffffff">
</head>
<body>
    <header>
        <div class="header-left">
            <span id="data-atual"></span>
            <span id="periodo-usuario"></span>
        </div>
        <div class="header-center">
            <img src="{{ url_for('static', filename='images/logo_paestro.png') }}" alt="Logo PAESTRO" class="logo">
        </div>
        <div class="header-right">
            <div class="user-info">
                <div class="user-icon">
                    <i class="fas fa-user"></i>
                </div>
                <span id="nome-usuario"></span>
            </div>
        </div>
    </header>

    <nav class="nav-container">
        <div class="nav-links">
            <a href="/" class="nav-link">
                <i class="fas fa-home"></i> Início
            </a>
            <a href="/chamada" class="nav-link">
                <i class="fas fa-clipboard-check"></i> Chamada
            </a>

            <a href="/analise" class="nav-link">
                <i class="fas fa-chart-bar"></i> Análise
            </a>
            <a href="/exportar" class="nav-link active">
                <i class="fas fa-file-export"></i> Exportar
            </a>
            <a href="/relatorio" class="nav-link">
                <i class="fas fa-file-contract"></i> Relatório
            </a>
        </div>
    </nav>


    <main>
        <div class="export-container">
            <h3>Exportar Chamadas</h3>

            <!-- Loading Indicator -->
            <div id="loading-indicator" style="display: none; position: fixed; top: 20px; right: 20px; padding: 15px; background: #fff; border: 1px solid #ddd; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1);">


            </div>

            <div class="export-options">
                <h4 class="section-title">Salvar chamada no Google Drive</h4>
                <div class="form-group">
                    <!-- Custom select-like component -->
                    <div class="custom-select-wrapper">
                        <div class="custom-select">
                            <input type="text" class="custom-select-input" placeholder="Buscar pasta..." autocomplete="off">
                            <span class="custom-select-clear" style="display: none;">✕</span>
                            <span class="custom-select-arrow">▼</span>
                        </div>
                        <div class="custom-select-dropdown" style="display: none;"></div>
                        <!-- Hidden select to store the actual value -->
                        <select id="pasta-drive" class="presenca-select" style="display: none;"></select>
                    </div>
                </div>

                <div class="buttons-container">
                    <button id="salvar-drive-btn" class="btn-action">
                        <i class="fas fa-cloud-upload-alt"></i>
                        Salvar no Drive
                    </button>
                </div>

                <div class="export-divider">ou</div>

                <h4 class="section-title">Baixar chamada no dispositivo</h4>
                <div class="buttons-container">
                    <button id="baixar-excel-btn" class="btn-action">
                        <i class="fas fa-file-excel"></i>
                        Baixar Excel
                    </button>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <p>Secretaria de Educação © 2025</p>
    </footer>

    <script src="/static/js/modal.js"></script>
    <script src="/static/js/exportar.js"></script>
</body>
</html>
