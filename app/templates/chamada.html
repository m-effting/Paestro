<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PAESTRO - Chamada</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/navbar.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/header.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/chamada.css') }}">
    <link rel="icon" href="{{ url_for('static', filename='css/favicon12.png') }}" type="image/png"> 
    <meta name="msapplication-TileColor" content="#ffffff"> 
    <meta name="theme-color" content="#ffffff">
</head>
<body>
    <div class="header-wrapper">
        <header>
            <div class="header-left">
                <span id="data-atual"></span>
                <span id="periodo-usuario"></span>
            </div>
            <div class="header-center">
                <img src="{{ url_for('static', filename='images/logo_paestro.png') }}" alt="Logo PAESTRO" class="logo">
            </div>
            <div class="header-right">
                <div class="user-info">
                    <div class="user-icon">
                        <i class="fas fa-user"></i>
                    </div>
                    <span id="nome-usuario"></span>
                </div>
            </div>
        </header>
    </div>

    <nav class="nav-container">
        <div class="nav-links">
            <a href="/" class="nav-link">
                <i class="fas fa-home"></i> Início
            </a>
            <a href="/chamada" class="nav-link active">
                <i class="fas fa-clipboard-check"></i> Chamada
            </a>
            <a href="/analise" class="nav-link">
                <i class="fas fa-chart-bar"></i> Análise
            </a>
            <a href="/relatorio" class="nav-link">
                <i class="fas fa-file-contract"></i> Relatório
            </a>
        </div>
    </nav>

    <div class="sub-nav-container">
        <div class="sub-nav-links">
            <button class="sub-nav-link" id="importar-btn">
                <i class="fas fa-file-import"></i> Importar
            </button>
            <button class="sub-nav-link" id="exportar-btn" disabled>
                <i class="fas fa-file-export"></i> Exportar
            </button>
        </div>
    </div>

    <main>
        <div class="chamada-container">
            <h3>Chamada</h3>

            <div class="filtros-container">
                <div class="filtros">
                    <div class="form-group">
                        <label for="escola-select">Escola</label>
                        <select id="escola-select">
                            <option value="">Selecione a escola</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="turma-select">Turma</label>
                        <select id="turma-select">
                            <option value="">Selecione a turma</option>
                        </select>
                    </div>
                </div>
                <div class="filter-buttons">
                    <button id="add-aluno-btn" class="btn-action">
                        <svg class="btn-icon" viewBox="0 0 24 24" width="16" height="16">
                            <path fill="currentColor" d="M19,13H13V19H11V13H5V11H11V5H13V11H19V13Z" />
                        </svg>
                        Adicionar Aluno
                    </button>
                    <button id="anotacoes-btn" class="btn-circle" title="Anotações da Unidade">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="white">
                            <path d="M19 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V6l-1-4zm-1 2v16H6V4h12zm-4 2H8v2h6V6zm0 4H8v2h6v-2zm0 4H8v2h6v-2z"/>
                        </svg>
                    </button>
                </div>
            </div>

            <div class="tabela-container">
                <table id="alunos-table">
                    <thead>
                        <tr>
                            <th>Nome</th>
                            <th>Presença</th>
                            <th>Observações</th>
                        </tr>
                    </thead>
                    <tbody>
                        </tbody>
                </table>
            </div>

            <div class="actions">
                <button id="salvar-chamada-btn" class="btn-action">
                    <svg class="btn-icon" viewBox="0 0 24 24" width="16" height="16">
                        <path fill="currentColor" d="M15,9H5V5H15M12,19A3,3 0 0,1 9,16A3,3 0 0,1 12,13A3,3 0 0,1 15,16A3,3 0 0,1 12,19M17,3H5C3.89,3 3,3.9 3,5V19A2,2 0 0,0 5,21H19A2,2 0 0,0 21,19V7L17,3Z" />
                    </svg>
                    Salvar Chamada
                </button>
            </div>
        </div>
    </main>

    <footer>
        <p>Secretaria de Educação © {{ now.year }}</p>
    </footer>

    <script src="{{ url_for('static', filename='js/modal.js') }}"></script>
    <script src="{{ url_for('static', filename='js/chamada.js') }}"></script>
</body>
</html>
